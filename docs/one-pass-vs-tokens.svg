<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 462" width="880" height="462" role="img" aria-label="A traditional LLM builds its answer one token at a time, each token fed back into the model, while Jev returns the whole typed answer in a single pass with no loop.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="arBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f0a868"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="462" rx="14" fill="#0d1117"/>

  <text x="28" y="38" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3">Same question, two machines</text>
  <text x="28" y="58" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">Classify a support ticket: is it billing, technical, or other?</text>

  <!-- ================= LANE A: traditional LLM ================= -->
  <rect x="20" y="76" width="840" height="182" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="38" y="102" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f0a868">Traditional LLM &#183; autoregressive</text>
  <text x="38" y="122" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8b949e">writes the answer out, one piece at a time</text>

  <g opacity="0">
    <rect x="38" y="140" width="212" height="40" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="52" y="165" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#c9d1d9">"I was charged twice"</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0222;0.0667;0.8444;0.9111;1" dur="9s" repeatCount="indefinite"/>
  </g>
  <line x1="254" y1="160" x2="290" y2="160" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="294" y="136" width="96" height="48" rx="8" fill="#21262d" stroke="#f0a868" stroke-width="1.4"/>
  <text x="342" y="165" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#f0a868">LLM</text>

  <line x1="394" y1="160" x2="424" y2="160" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ar)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <g opacity="0">
      <rect x="430" y="142" width="26" height="36" rx="6" fill="#2d2114" stroke="#f0a868" stroke-width="1.2"/>
      <text x="443" y="165" text-anchor="middle" fill="#f0a868">{</text>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1333;0.1467;0.8444;0.9111;1" dur="9s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <rect x="462" y="142" width="96" height="36" rx="6" fill="#2d2114" stroke="#f0a868" stroke-width="1.2"/>
      <text x="510" y="165" text-anchor="middle" fill="#f0a868">"category"</text>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1944;0.2078;0.8444;0.9111;1" dur="9s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <rect x="564" y="142" width="22" height="36" rx="6" fill="#2d2114" stroke="#f0a868" stroke-width="1.2"/>
      <text x="575" y="165" text-anchor="middle" fill="#f0a868">:</text>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2556;0.2689;0.8444;0.9111;1" dur="9s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <rect x="592" y="142" width="86" height="36" rx="6" fill="#2d2114" stroke="#f0a868" stroke-width="1.2"/>
      <text x="635" y="165" text-anchor="middle" fill="#f0a868">"billing"</text>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3167;0.33;0.8444;0.9111;1" dur="9s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <rect x="684" y="142" width="26" height="36" rx="6" fill="#2d2114" stroke="#f0a868" stroke-width="1.2"/>
      <text x="697" y="165" text-anchor="middle" fill="#f0a868">}</text>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3778;0.3911;0.8444;0.9111;1" dur="9s" repeatCount="indefinite"/>
    </g>
  </g>

  <path d="M 700 186 C 700 230, 350 234, 344 190" fill="none" stroke="#f0a868" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arAmber)" opacity="0.9">
    <animate attributeName="stroke-dashoffset" values="27;0" dur="1.1s" repeatCount="indefinite"/>
  </path>
  <text x="524" y="250" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#f0a868">every piece goes back in before the next one can be written</text>

  <text x="746" y="150" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e6edf3">5 steps</text>
  <text x="746" y="168" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">one after</text>
  <text x="746" y="182" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">another</text>

  <!-- ================= LANE B: Jev ================= -->
  <rect x="20" y="274" width="840" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="38" y="300" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#58a6ff">Jev &#183; System One</text>
  <text x="38" y="320" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8b949e">picks from the answers you gave it, all at once</text>

  <g opacity="0">
    <rect x="38" y="338" width="212" height="40" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="52" y="363" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#c9d1d9">"I was charged twice"</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0222;0.0667;0.8444;0.9111;1" dur="9s" repeatCount="indefinite"/>
  </g>
  <line x1="254" y1="358" x2="290" y2="358" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="294" y="334" width="96" height="48" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="1.4"/>
  <text x="342" y="363" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#58a6ff">Jev</text>

  <line x1="394" y1="358" x2="424" y2="358" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#arBlue)"/>
  <text x="409" y="344" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#58a6ff">1 pass</text>

  <g opacity="0">
    <rect x="430" y="330" width="280" height="56" rx="8" fill="#0f2233" stroke="#58a6ff" stroke-width="1.6"/>
    <text x="446" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#58a6ff">billing</text>
    <text x="446" y="371" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8b949e">billing 0.94 &#183; technical 0.04 &#183; other 0.02</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1667;0.8444;0.9111;1" dur="9s" repeatCount="indefinite"/>
  </g>

  <text x="746" y="348" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e6edf3">1 step</text>
  <text x="746" y="366" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">no loop</text>
  <text x="746" y="380" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">back</text>

  <text x="28" y="448" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">Nothing is spelled out, so there is no half-written answer to wait for &#8212; and no sentence to parse afterwards.</text>
</svg>
