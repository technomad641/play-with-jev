[project]
name = "play-with-jev"
version = "0.1.0"
description = "Snake with Jev, TypeSafe AI's System One model, choosing every turn."
requires-python = ">=3.10"
dependencies = ["typesafe-sdk>=0.1.0"]

[project.scripts]
jevsnake = "jevsnake.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevsnake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
