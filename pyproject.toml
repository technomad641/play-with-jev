[project]
name = "jevscan"
version = "0.1.0"
description = "Find Jev-related posts in your X account using Jev, TypeSafe AI's System One model."
requires-python = ">=3.10"
dependencies = ["typesafe-sdk>=0.1.0"]

[project.scripts]
jevscan = "jevscan.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
